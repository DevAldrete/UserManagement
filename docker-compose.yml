services:
  # The PostgreSQL Database Service
  db:
    image: postgres:16 # Using Postgres 16, but 'latest' is also fine
    container_name: user_project_db
    restart: always
    environment:
      # These variables create the default user and database
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: user_db
    ports:
      # Exposes the DB on your host machine's port 5432
      # So you can connect with a tool like DBeaver or PgAdmin
      - "5432:5432"
    volumes:
      # This creates a "named volume" to make your data permanent
      # Even if you stop/remove the container, your data stays
      - postgres_data:/var/lib/postgresql/data

  # # Your .NET API Service
  # api:
  #   container_name: user_project_api
  #   # Tells Docker Compose to build the image from the Dockerfile
  #   # in the current directory ('.')
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   restart: always
  #   ports:
  #     # Maps your host port 8080 to the container's port 8080
  #     - "8080:8080"
  #   environment:
  #     # This tells the .NET app inside the container to listen on port 8080
  #     ASPNETCORE_URLS: http://+:8080
  #
  #     # This is the magic part! This environment variable overrides
  #     # your appsettings.json. .NET's config system automatically
  #     # maps 'ConnectionStrings__DefaultConnection' to
  #     # "ConnectionStrings": { "DefaultConnection": "..." }
  #     ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=user_db;Username=myuser;Password=mypassword;"
  #
  #   # This ensures that the 'db' container is started *before* your API
  #   depends_on:
  #     - db

# This top-level key defines the named volume we used above
volumes:
  postgres_data:
